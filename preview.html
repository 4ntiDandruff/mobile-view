<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile View - Standalone Studio</title>
  <link rel="icon" type="image/png" href="icons/icon32.png">
  <link rel="stylesheet" href="content.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #07090e;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", system-ui, sans-serif;
    }
    #mv-studio-standalone {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .mv-url-form {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 3px 8px;
      gap: 6px;
      flex: 1;
      max-width: 400px;
    }
    .mv-url-input {
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 12px;
      font-family: monospace;
      width: 100%;
    }
  </style>
</head>
<body id="mv-studio-overlay">
  <div id="mv-studio-standalone">
    <!-- Standalone Header -->
    <div id="mv-topbar">
      <div class="mv-group">
        <div class="mv-brand">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect width="14" height="20" x="5" y="2" rx="3" ry="3"/>
            <path d="M12 18h.01"/>
          </svg>
          <span>Mobile View</span>
        </div>

        <!-- URL Input -->
        <form id="url-form" class="mv-url-form">
          <input type="text" id="url-input" class="mv-url-input" placeholder="https://..." value="https://google.com">
          <button type="submit" class="mv-btn" style="padding: 2px 8px; font-size: 11px;">Muat</button>
        </form>

        <!-- Device Dropdown -->
        <select id="device-select" class="mv-select">
          <option value="iphone15pro">iPhone 15 Pro (393×852)</option>
          <option value="iphone14">iPhone 14 (390×844)</option>
          <option value="iphonese">iPhone SE (375×667)</option>
          <option value="galaxys24">Galaxy S24 (412×915)</option>
          <option value="pixel8">Pixel 8 (412×892)</option>
          <option value="ipadmini">iPad Mini (768×1024)</option>
        </select>

        <!-- Rotate Button -->
        <button id="rot-btn" class="mv-btn" title="Putar Layar (R)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
          <span>Putar</span>
          <span class="mv-kbd">R</span>
        </button>
      </div>

      <!-- Right: Inspect Hint & Zoom -->
      <div class="mv-group">
        <div class="mv-inspect-hint">
          <div class="mv-beacon"></div>
          <span>Klik kanan di layar HP ➜ Inspect (F12)</span>
        </div>

        <div class="mv-neo-groove">
          <button id="fit-btn" class="mv-tab-pill mv-active">Fit</button>
          <button id="z75-btn" class="mv-tab-pill">75%</button>
          <button id="z100-btn" class="mv-tab-pill">100%</button>
        </div>

        <button id="reload-btn" class="mv-btn" title="Segarkan Halaman">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 21h5v-5"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Canvas -->
    <div id="mv-canvas">
      <div id="mv-scale-wrapper">
        <div id="mv-phone-frame" class="mv-phone-frame">
          <div id="mv-hw-buttons"></div>
          <div id="mv-screen-container" class="mv-screen-container">
            <iframe id="mv-viewport-iframe" src="https://google.com"></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="preview.js"></script>
</body>
</html>
