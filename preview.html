<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile View - Studio</title>
  <link rel="icon" type="image/png" href="icons/icon32.png">
  <link rel="stylesheet" href="content.css">
</head>
<body id="mv-studio-overlay" class="mv-standalone-body">
  <!-- Topbar Studio (Identik & Konsisten 100%) -->
  <div id="mv-topbar">
    <!-- Brand & Quick Device Segmented Chips -->
    <div class="mv-group">
      <div class="mv-brand">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect width="14" height="20" x="5" y="2" rx="3" ry="3"/>
          <path d="M12 18h.01"/>
        </svg>
        <span>Mobile View</span>
      </div>

      <!-- Quick 1-Click Segmented Devices (Concentric Radii) -->
      <div class="mv-neo-groove">
        <button class="mv-tab-pill mv-dev-chip mv-active" data-dev="iphone15pro">
          iPhone 15 Pro
        </button>
        <button class="mv-tab-pill mv-dev-chip" data-dev="galaxys24">
          Galaxy S24
        </button>
        <button class="mv-tab-pill mv-dev-chip" data-dev="iphonese">
          SE
        </button>
        <button class="mv-tab-pill mv-dev-chip" data-dev="ipadmini">
          iPad
        </button>
      </div>
    </div>

    <!-- Center: Metrics + Rotate + Frame Toggle + Reload -->
    <div class="mv-group">
      <div id="mv-dim-badge" class="mv-dim-pill"><span class="mv-dim-dot"></span><span>393 × 852 px</span></div>

      <!-- Rotate Button -->
      <button id="mv-rot-btn" class="mv-btn" title="Putar Layar (Tekan R)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        <span>Putar</span>
        <span class="mv-kbd">R</span>
      </button>

      <!-- Frame On/Off Toggle Button -->
      <button id="mv-frame-btn" class="mv-btn mv-btn-active" title="Saklar Bingkai HP (Tekan F)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect width="18" height="18" x="3" y="3" rx="4"/>
          <path d="M7 7h10v10H7z" opacity="0.5"/>
        </svg>
        <span>Bingkai</span>
        <span class="mv-kbd">F</span>
      </button>

      <!-- Reload Button -->
      <button id="mv-reload-btn" class="mv-btn" title="Segarkan Layar">
        <svg id="mv-reload-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M16 21h5v-5"/>
        </svg>
      </button>
    </div>

    <!-- Right: Segmented Zoom, Theme Toggle, & Close -->
    <div class="mv-group">
      <!-- Neomorphic Segmented Track for Zoom -->
      <div class="mv-neo-groove">
        <button id="mv-fit-btn" class="mv-tab-pill mv-active">Fit</button>
        <button id="mv-z100-btn" class="mv-tab-pill">100%</button>
      </div>

      <!-- Cupertino Theme Toggle (Light / Dark) -->
      <button id="mv-theme-btn" class="mv-btn" title="Ganti Tema (Tekan T)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <span class="mv-kbd">T</span>
      </button>

      <!-- Close / Back to Desktop -->
      <button id="mv-close-btn" class="mv-btn mv-btn-close" title="Tutup Tab (Esc)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
        <span>Tutup</span>
        <span class="mv-kbd">Esc</span>
      </button>
    </div>
  </div>

  <!-- Canvas Area (Clean Floating Center) -->
  <div id="mv-canvas">
    <div id="mv-scale-wrapper">
      <!-- Ambient Diffuse Glow -->
      <div class="mv-ambient-glow"></div>

      <!-- Phone Chassis -->
      <div id="mv-phone-frame" class="mv-phone-frame">
        <!-- Hardware Buttons -->
        <div id="mv-hw-buttons"></div>

        <!-- Screen Viewport (100% Bersih Tanpa Obstruksi Kamera) -->
        <div id="mv-screen-container" class="mv-screen-container">
          <iframe id="mv-viewport-iframe" src="about:blank"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script src="preview.js"></script>
</body>
</html>
